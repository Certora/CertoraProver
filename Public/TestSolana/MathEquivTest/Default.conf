{
    "build_script": "./certora_build.sh",
    "java_args": ["-Dlevel.sbf=info"],
    "rule": [
        "checked_add_i64",
        "checked_add_u64",
        "checked_add_i128",
        "checked_add_u128",
        "checked_sub_i64",
        "checked_sub_u64",
        "checked_sub_i128",
        "checked_sub_u128",
        "checked_mul_i64",
        "checked_mul_u64",
        "checked_mul_i128",
        "checked_mul_u128",
        "checked_div_i64",
        "checked_div_u64",
        "checked_div_i128",
        "checked_div_u128",
        "saturating_add_i64",
        "saturating_add_u64",
        "saturating_add_i128",
        "saturating_add_u128",
        "saturating_sub_i64",
        "saturating_sub_u64",
        "saturating_sub_i128",
        "saturating_sub_u128",
        "saturating_mul_i64",
        "saturating_mul_u64",
        "saturating_mul_i128",
        "saturating_mul_u128",
        "saturating_div_i64",
        "saturating_div_u64",
        "saturating_div_i128",
        "saturating_div_u128",
        "saturating_neg_i64",
        "saturating_neg_i128",
        "saturating_abs_i64",
        "saturating_abs_i128",
        "unsigned_abs_i64",
        "unsigned_abs_i128",
        "checked_abs_i64",
        "checked_abs_i128",
        "add_negative_constant",
        "sub_negative_constant",
        "add_no_overflow_u64",
        "sub_no_borrow_u64",
        "gt_signed_to_unsigned_i64",
        "ge_signed_to_unsigned_i64",
        "shr63_u64",
        "mod_sub_eq_u64",
        "mod_and_u64",
        "sub_flip_sign_u64",
        "signext_mod_sign_i8",
        "signext_mod_nonzero_i8",
    ],
    "prover_args": [
	    "-solanaTACSoundSignedMath true",
        "-solanaTACMathInt true",
        "-solanaPrintAnalyzedToDot",
        "-regressionTest"
    ],
    "cargo_tools_version": "v1.53",
    "rule_sanity": "basic"
}
